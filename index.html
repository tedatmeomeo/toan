<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website by ThanhDat</title>

  <!-- Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(180deg, #120020, #154355);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* Avatar */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 3px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #00e1ff, #8a2be2);
      box-shadow: 0 0 15px rgba(0, 225, 255, 0.6);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Typing text */
    h1 {
      font-size: 32px;
      font-family: monospace;
      border-right: 3px solid #00e1ff;
      white-space: nowrap;
      overflow: hidden;
      animation: blink 0.7s infinite;
      min-height: 40px;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .desc {
      font-size: 14px;
      color: #bbb;
      margin: 15px 0 25px;
    }

    /* Social icons */
    .socials a {
      font-size: 22px;
      margin: 0 10px;
      color: #00e1ff;
      transition: 0.3s;
    }

    .socials a:hover {
      color: #00ffff;
      transform: scale(1.2);
    }

    footer {
      font-size: 12px;
      color: #888;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Avatar -->
    <div class="avatar">
      <img src="avt.jpg" alt="avatar">
    </div>

    <!-- Text typing -->
    <h1 id="text"></h1>

    <p class="desc">“deo co me gi dau ton thoi gian chua !”</p>

    <!-- Social -->
    <div class="socials">
      <a href="https://www.instagram.com/_t.datt07/"><i class="fab fa-instagram"></i></a>
      <a href="mailto:thanhdatbmq@gmail.com"><i class="fas fa-envelope"></i></a>
      <a href="https://www.facebook.com/tdatcutiihihihi"><i class="fab fa-facebook"></i></a>
      <a href="https://www.tiktok.com/@zaihubngongheck"><i class="fab fa-tiktok"></i></a>
    </div>

  </div>

  <footer>
    © 2025 Thanh Dat!
  </footer>

  <script>
    const text = "bbi em la ai?";
    let i = 0;

    function typeEffect() {
      const el = document.getElementById("text");

      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(typeEffect, 120);
      } else {
        setTimeout(() => {
          i = 0;
          typeEffect();
        }, 1500);
      }
    }

    typeEffect();
  </script>

</body>
</html>
